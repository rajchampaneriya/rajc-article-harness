<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4A5D78"/></marker>
<style>
text{font-family:Inter,'DejaVu Sans',sans-serif;fill:#0F2744}
.h{font-size:26px;font-weight:700}.st{font-size:16px;fill:#4A5D78}
.t{font-size:19px;font-weight:700}.s{font-size:15px;fill:#4A5D78}
.ink{stroke:#0F2744;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.soft{stroke:#4A5D78;stroke-width:2;fill:none;stroke-linecap:round}
.blue{stroke:#2F6FD6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.flow{stroke:#4A5D78;stroke-width:2;fill:none;stroke-dasharray:6 7}
</style>
</defs>
<rect width="1200" height="420" fill="#FFFDF8"/>
<text class="h" x="60" y="58">The article is already in you.</text>
<text class="st" x="60" y="86">These questions help it out, one honest answer at a time.</text>

<!-- Panel 1: a head holding a tangled idea -->
<g transform="translate(200,235)">
  <path class="ink" d="M-62 70 C-70 30,-78 -10,-60 -45 C-40 -85,30 -92,58 -55 C78 -28,72 8,62 24 L70 46 L56 50 L58 70"/>
  <path class="blue" d="M-30 -30 C-10 -55,25 -40,12 -20 C0 -2,-35 -12,-18 -38 C-5 -58,40 -50,30 -22 C22 0,-12 6,-6 -14 C0 -30,22 -26,16 -10"/>
  <text class="t" x="0" y="112" text-anchor="middle">Your idea</text>
  <text class="s" x="0" y="136" text-anchor="middle">still tangled, and that is fine</text>
</g>

<path class="flow" d="M330 230 C 380 205, 420 205, 470 225" marker-end="url(#a)"/>

<!-- Panel 2: questions pulling the thread (you are here) -->
<g transform="translate(600,235)">
  <rect x="-125" y="-120" width="250" height="190" rx="18" fill="#FFF3DC" stroke="#F2A541" stroke-width="2.5"/>
  <text x="0" y="-132" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#B9741A;letter-spacing:2px">YOU ARE HERE</text>
  <path class="ink" d="M-70 -60 h90 a14 14 0 0 1 14 14 v34 a14 14 0 0 1 -14 14 h-58 l-18 16 v-16 h-14 a14 14 0 0 1 -14 -14 v-34 a14 14 0 0 1 14 -14z"/>
  <text x="-25" y="-17" text-anchor="middle" style="font-size:34px;font-weight:700;fill:#2F6FD6">?</text>
  <path class="blue" d="M30 -20 C55 -10,40 20,70 25 C88 28,95 10,100 0"/>
  <circle cx="100" cy="0" r="5" fill="#2F6FD6"/>
  <g fill="#0F2744"><circle cx="-60" cy="40" r="5"/><circle cx="-40" cy="40" r="5"/><circle cx="-20" cy="40" r="5"/><circle cx="0" cy="40" r="5"/><circle cx="20" cy="40" r="5"/><circle cx="40" cy="40" r="5"/><circle cx="60" cy="40" r="5"/></g>
  <text class="t" x="0" y="112" text-anchor="middle">Seven questions</text>
  <text class="s" x="0" y="136" text-anchor="middle">only you can answer them</text>
</g>

<path class="flow" d="M735 230 C 785 205, 825 205, 875 225" marker-end="url(#a)"/>

<!-- Panel 3: a page that grows from the answers -->
<g transform="translate(1000,235)">
  <path class="ink" d="M-55 -85 h80 l30 30 v130 h-110z"/>
  <path class="ink" d="M25 -85 v30 h30"/>
  <path class="soft" d="M-38 -40 h70 M-38 -18 h80 M-38 4 h60 M-38 26 h76 M-38 48 h44"/>
  <path class="blue" d="M45 40 l22 -22 l10 10 l-22 22 l-14 4z"/>
  <text class="t" x="0" y="112" text-anchor="middle">Your draft</text>
  <text class="s" x="0" y="136" text-anchor="middle">built from your words, next</text>
</g>
</svg>
